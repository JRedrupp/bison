name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC
  workflow_dispatch:      # allow manual triggers
  pull_request:           # run on every PR to catch nightly breakage early
  push:
    branches: [main]      # run on every merge to main

jobs:
  test-nightly:
    name: test (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Float to latest nightly MAX build
        run: |
          sed -i \
            -E 's|max = "==[^"]+"|max = "*"|; s|mblack = "==[^"]+"|mblack = "*"|' \
            pixi.toml

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          locked: false

      - name: Generate version file
        run: pixi run gen-version

      - name: Run tests
        run: pixi run test

      - name: File or update tracking issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'nightly-broken';
            const title = 'Nightly build is broken against latest Mojo/MAX';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Still failing: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body: `The scheduled nightly build failed against the latest MAX nightly.\n\nRun: ${runUrl}`,
              });
            }
